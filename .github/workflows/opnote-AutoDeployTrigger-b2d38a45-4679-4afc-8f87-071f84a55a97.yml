name: Build and push opnote

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: opnoteacr2.azurecr.io
          username: ${{ secrets.OPNOTE_REGISTRY_USERNAME }}
          password: ${{ secrets.OPNOTE_REGISTRY_PASSWORD }}

      - name: Build and push
        run: |
          docker build -t opnoteacr2.azurecr.io/opnote:${{ github.sha }} -t opnoteacr2.azurecr.io/opnote:latest .
          docker push opnoteacr2.azurecr.io/opnote:${{ github.sha }}
          docker push opnoteacr2.azurecr.io/opnote:latest
